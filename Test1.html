<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client & Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, textarea, button, select {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    li:hover {
      background: #f1f1f1;
    }
    .small {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Client & Notes</h1>

  <div class="container">
    <!-- Clients -->
    <div class="card">
      <h3>Add Client</h3>
      <input id="clientName" placeholder="Client name" />
      <button onclick="addClient()">Add Client</button>

      <h3 style="margin-top:20px">Clients</h3>
      <ul id="clientList"></ul>
    </div>

    <!-- Notes -->
    <div class="card">
      <h3>Notes</h3>
      <select id="clientSelect"></select>
      <textarea id="noteText" placeholder="Write notes here..."></textarea>
      <button onclick="saveNote()">Save Note</button>

      <h4 style="margin-top:20px">Saved Notes</h4>
      <ul id="noteList"></ul>
    </div>
  </div>

<script>
  const STORAGE_KEY = "client_notes_app";

  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    clients: {},
    selectedClient: null
  };

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function addClient() {
    const name = clientName.value.trim();
    if (!name || data.clients[name]) return;
    data.clients[name] = [];
    data.selectedClient = name;
    clientName.value = "";
    saveData();
    render();
  }

  function selectClient(name) {
    data.selectedClient = name;
    saveData();
    render();
  }

  function saveNote() {
    if (!data.selectedClient) return;
    const text = noteText.value.trim();
    if (!text) return;
    data.clients[data.selectedClient].push({
      text,
      time: new Date().toLocaleString()
    });
    noteText.value = "";
    saveData();
    render();
  }

  function render() {
    // Clients list
    clientList.innerHTML = "";
    clientSelect.innerHTML = "";

    Object.keys(data.clients).forEach(name => {
      const li = document.createElement("li");
      li.textContent = name;
      li.onclick = () => selectClient(name);
      clientList.appendChild(li);

      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if (name === data.selectedClient) opt.selected = true;
      clientSelect.appendChild(opt);
    });

    // Notes
    noteList.innerHTML = "";
    if (data.selectedClient) {
      (data.clients[data.selectedClient] || []).forEach(n => {
        const li = document.createElement("li");
        li.innerHTML = `<div>${n.text}</div><div class="small">${n.time}</div>`;
        noteList.appendChild(li);
      });
    }
  }

  render();
</script>
</body>
</html>
