<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client & Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }

    .container {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea { min-height: 120px; }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      padding: 8px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li span { cursor: pointer; }
    li:hover { background: #f1f1f1; }

    .active { font-weight: bold; background: #eef2ff; }
    .small { font-size: 12px; color: #666; }
    .danger {
      background: #dc2626;
      margin-left: 6px;
    }
    .danger:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <h1>Client & Notes</h1>

  <div class="container">
    <!-- Clients -->
    <div class="card">
      <h3>Add Client</h3>
      <input id="clientName" placeholder="Client name" />
      <button onclick="addClient()">Add Client</button>

      <h3 style="margin-top:20px">Clients</h3>
      <ul id="clientList"></ul>
    </div>

    <!-- Notes -->
    <div class="card">
      <h3>Notes</h3>
      <div id="activeClient" class="small">No client selected</div>
      <textarea id="noteText" placeholder="Write notes here..."></textarea>
      <button onclick="saveNote()">Save Note</button>

      <h4 style="margin-top:20px">Saved Notes</h4>
      <ul id="noteList"></ul>
    </div>
  </div>

<script>
const STORAGE_KEY = "client_notes_app";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  clients: {},
  selectedClient: null
};

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function addClient() {
  const name = clientName.value.trim();
  if (!name || data.clients[name]) return;
  data.clients[name] = [];
  data.selectedClient = name;
  clientName.value = "";
  saveData();
  render();
}

function deleteClient(name) {
  if (!confirm(`Delete client "${name}" and all notes?`)) return;
  delete data.clients[name];
  if (data.selectedClient === name) data.selectedClient = null;
  saveData();
  render();
}

function selectClient(name) {
  data.selectedClient = name;
  saveData();
  render();
}

function saveNote() {
  if (!data.selectedClient) return;
  const text = noteText.value.trim();
  if (!text) return;
  data.clients[data.selectedClient].push({
    text,
    time: new Date().toLocaleString()
  });
  noteText.value = "";
  saveData();
  render();
}

function deleteNote(index) {
  if (!confirm("Delete this note?")) return;
  data.clients[data.selectedClient].splice(index, 1);
  saveData();
  render();
}

function render() {
  // Active client
  activeClient.textContent = data.selectedClient
    ? `Client: ${data.selectedClient}`
    : "No client selected";

  // Clients
  clientList.innerHTML = "";
  Object.keys(data.clients).forEach(name => {
    const li = document.createElement("li");

    const label = document.createElement("span");
    label.textContent = name;
    label.onclick = () => selectClient(name);
    if (name === data.selectedClient) label.classList.add("active");

    const del = document.createElement("button");
    del.textContent = "✕";
    del.className = "danger";
    del.onclick = () => deleteClient(name);

    li.appendChild(label);
    li.appendChild(del);
    clientList.appendChild(li);
  });

  // Notes
  noteList.innerHTML = "";
  if (data.selectedClient) {
    data.clients[data.selectedClient].forEach((n, i) => {
      const li = document.createElement("li");

      const content = document.createElement("span");
      content.innerHTML = `<div>${n.text}</div><div class="small">${n.time}</div>`;

      const del = document.createElement("button");
      del.textContent = "✕";
      del.className = "danger";
      del.onclick = () => deleteNote(i);

      li.appendChild(content);
      li.appendChild(del);
      noteList.appendChild(li);
    });
  }
}

render();
</script>
</body>
</html>
